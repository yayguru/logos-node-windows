name: Feature request
description: Suggest an improvement for the Windows build or the panel
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: markdown
    attributes:
      value: Changes to the node itself belong upstream in logos-blockchain/logos-blockchain.
